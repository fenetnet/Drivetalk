name: drivetalk
description: "DriveBond — voice-first app for meaningful conversations in dead time."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
