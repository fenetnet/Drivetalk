name: drivetalk
description: "DriveTalk — voice-first app for meaningful conversations in dead time."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  image_picker: ^1.2.3
  intl: ^0.20.3
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/config/
    - assets/content/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
