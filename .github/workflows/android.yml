# Checks the code and builds an installable Android prototype (APK) on every
# push. The APK appears under the run's "Artifacts" section on GitHub.
name: Android prototype

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a simple download link

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Prototype build: fake data + developer tools enabled.
      # (Store builds will never pass DEV_TOOLS=true.)
      - name: Build APK
        run: flutter build apk --release --dart-define=DEV_TOOLS=true

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk drivetalk-prototype.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drivetalk-prototype-apk
          path: drivetalk-prototype.apk
          retention-days: 30

      # One fixed, easy download link (no ZIP):
      # https://github.com/<owner>/<repo>/releases/tag/prototype
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prototype --yes --cleanup-tag || true
          gh release create prototype drivetalk-prototype.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "DriveTalk — גרסת ניסיון" \
            --notes "גרסת ניסיון עם נתונים מדומים. להורדה: ללחוץ על drivetalk-prototype.apk למטה, ואז לפתוח את הקובץ בטלפון."
