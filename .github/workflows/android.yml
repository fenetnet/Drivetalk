# Checks the code and builds an installable Android prototype (APK) on every
# push. The APK appears under the run's "Artifacts" section on GitHub.
name: Android prototype

on:
  push:
    branches: [main, "claude/**"]
    # Server-only / docs-only changes don't need a new app build.
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "tool/**"
      - "invite_site/**"
      - "store_assets/**"
      - ".github/workflows/supabase-migrate.yml"
      - ".github/workflows/invite-site.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a simple download link

# A newer push replaces an older build still running (both would publish
# the same download link at once).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Prototype build: fake data + developer tools enabled.
      # (Store builds will never pass DEV_TOOLS=true.)
      # Stable signing key from GitHub secrets (never stored in git), so each
      # new build installs as an update over the previous one.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/test.jks"
            echo "DT_KEYSTORE_PATH=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
          else
            echo "::error::The signing key secret is missing (ANDROID_TEST_KEYSTORE_BASE64)."
            exit 1
          fi

      # Real-mode server settings come from repository VARIABLES (Settings →
      # Secrets and variables → Actions → Variables). They are public by
      # design (Row Level Security protects the data). Never put the
      # service_role key or the database password here.
      - name: Invite link host
        env:
          INVITE_BASE_URL: ${{ vars.INVITE_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -n "$INVITE_BASE_URL" ]; then
            host=$(python3 -c "import sys,urllib.parse as u;print(u.urlparse(sys.argv[1]).hostname or '')" "$INVITE_BASE_URL")
            path=$(python3 -c "import sys,urllib.parse as u;print(u.urlparse(sys.argv[1]).path.rstrip('/'))" "$INVITE_BASE_URL")
            echo "INVITE_HOST=$host" >> "$GITHUB_ENV"
            echo "INVITE_PATH_PREFIX=$path/i/" >> "$GITHUB_ENV"
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL variable not set — the app uses the built-in default server."
          fi

      - name: Build APK
        env:
          DT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          INVITE_BASE_URL: ${{ vars.INVITE_BASE_URL }}
        run: >
          flutter build apk --release --dart-define=DEV_TOOLS=true
          --build-number=${{ github.run_number }}
          --dart-define="SUPABASE_URL=$SUPABASE_URL"
          --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          --dart-define="INVITE_BASE_URL=$INVITE_BASE_URL"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk drivetalk-prototype.apk

      # Google Play needs an App Bundle (.aab), signed with the same key
      # (used as the "upload key"). Same settings as the APK.
      - name: Build App Bundle (Google Play)
        env:
          # The package name registered in Google Play Console (permanent).
          DT_APP_ID: app.drivetalk.drivetalk
          DT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          INVITE_BASE_URL: ${{ vars.INVITE_BASE_URL }}
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=STORE=true
          --dart-define="SUPABASE_URL=$SUPABASE_URL"
          --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          --dart-define="INVITE_BASE_URL=$INVITE_BASE_URL"
          && mv build/app/outputs/bundle/release/app-release.aab drivetalk.aab

      - uses: actions/upload-artifact@v4
        with:
          name: drivetalk-prototype-apk
          path: drivetalk-prototype.apk
          retention-days: 30

      # One fixed, easy download link (no ZIP):
      # https://github.com/<owner>/<repo>/releases/tag/prototype
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app reads version.json to say "a new version is out".
          echo '{"build": ${{ github.run_number }}}' > version.json
          gh release delete prototype --yes --cleanup-tag || true
          gh release create prototype drivetalk-prototype.apk drivetalk.aab version.json \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "DriveBond — גרסת ניסיון" \
            --notes-file docs/install-guide-release.md
          # Sometimes GitHub leaves it as an unpublished draft (then the link
          # and "new version" check are 404). Publish explicitly and verify.
          for i in 1 2 3; do
            gh release edit prototype --draft=false --prerelease && break
            sleep 5
          done
          sleep 3
          curl -sfL "https://github.com/${{ github.repository }}/releases/download/prototype/version.json" \
            || { echo "::error::The download link is not public"; exit 1; }

      # Google Play: upload to internal testing by itself (D-084). Only when
      # the owner added the service account key as the repository secret
      # PLAY_SERVICE_ACCOUNT_JSON (never in the code).
      - name: Check Google Play key
        id: play
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$PLAY_KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play (internal testing)
        id: play_upload
        if: steps.play.outputs.ready == 'yes'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.drivetalk.drivetalk
          releaseFiles: drivetalk.aab
          track: internal
          status: completed
          releaseName: "${{ github.run_number }}"

      # An app not yet published to everyone may accept only a draft release:
      # then it waits in Play Console for one "Roll out" click.
      - name: Upload to Google Play (as a draft)
        if: steps.play.outputs.ready == 'yes' && steps.play_upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.drivetalk.drivetalk
          releaseFiles: drivetalk.aab
          track: internal
          status: draft
          releaseName: "${{ github.run_number }}"
