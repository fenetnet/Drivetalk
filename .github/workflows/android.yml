# Checks the code and builds an installable Android prototype (APK) on every
# push. The APK appears under the run's "Artifacts" section on GitHub.
name: Android prototype

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Prototype build: fake data + developer tools enabled.
      # (Store builds will never pass DEV_TOOLS=true.)
      - name: Build APK
        run: flutter build apk --release --dart-define=DEV_TOOLS=true

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk drivetalk-prototype.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drivetalk-prototype-apk
          path: drivetalk-prototype.apk
          retention-days: 30
