# Server health: every hour one tiny request asks the server its version —
# the same question the app asks. It keeps the free Supabase project from
# pausing, and when the server doesn't answer the run fails, so GitHub
# emails the owner at once (owner, 2026-11-08; was every 3 days).
# Public key only; no secrets. Scheduled workflows run only from main.
name: Keep server awake

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # A server that hangs must fail the run (→ email), not wait forever.
    timeout-minutes: 5
    steps:
      - name: Ask the server its version
        env:
          # Same default as lib/real/backend_config.dart (public address).
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://isjgrdiiawhyxzvzdkva.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY variables not set — nothing to keep awake."
            exit 0
          fi
          v=$(curl -fsS --max-time 20 --retry 3 --retry-max-time 90 -X POST "$SUPABASE_URL/rest/v1/rpc/schema_version" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Server is awake (version $v)."
