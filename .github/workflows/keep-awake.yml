# Keeps the free Supabase project from pausing (it pauses after a week
# with no activity): every 3 days, one tiny request asks the server its
# version — the same question the app asks. Public key only; no secrets.
# Scheduled workflows run only from the default branch (main).
name: Keep server awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the server its version
        env:
          # Same default as lib/real/backend_config.dart (public address).
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://isjgrdiiawhyxzvzdkva.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY variables not set — nothing to keep awake."
            exit 0
          fi
          v=$(curl -fsS --retry 3 -X POST "$SUPABASE_URL/rest/v1/rpc/schema_version" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Server is awake (version $v)."
