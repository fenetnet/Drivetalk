<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{font-family:"Rubik","Noto Sans Hebrew",sans-serif;color:#fff;position:relative;
 background:radial-gradient(circle at 25% 110%,#42A5F5 0%,#1E88E5 38%,#0D47A1 100%)}
.road{position:absolute;left:0;top:0;width:1024px;height:500px;opacity:.10}
.phone{position:absolute;left:70px;top:70px;width:270px;height:585px;border-radius:40px;background:#0E1B2C;padding:9px;
 transform:rotate(-8deg);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.phone img{width:100%;height:100%;border-radius:32px;object-fit:cover;object-position:top}
.chip{position:absolute;left:300px;top:96px;background:#fff;color:#1F2A3A;border-radius:22px;padding:10px 16px;font-size:20px;font-weight:700;
 box-shadow:0 10px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;direction:var(--dir)}
.dot{width:12px;height:12px;border-radius:50%;background:#3FA37A;flex:none}
.txt{position:absolute;right:64px;top:84px;width:520px;text-align:var(--align);direction:var(--dir)}
.brand{display:flex;align-items:center;gap:16px;justify-content:flex-start;direction:ltr;margin-bottom:22px}
.brand img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.brand span{font-size:40px;font-weight:800;letter-spacing:-.5px}
h1{margin:0;font-size:58px;line-height:1.08;font-weight:800;white-space:pre-line}
p{margin:18px 0 0;font-size:25px;line-height:1.35;opacity:.92}
</style></head><body>
<svg class="road" viewBox="0 0 1024 500"><path d="M-50 520 C 300 300, 600 260, 1100 -40" stroke="#fff" stroke-width="90" fill="none"/>
<path d="M-50 520 C 300 300, 600 260, 1100 -40" stroke="#0D47A1" stroke-width="8" stroke-dasharray="40 34" fill="none"/></svg>
<div class="phone"><img src="drivingOffer.png"></div>
<div class="chip"><span class="dot"></span><span id="chip"></span></div>
<div class="txt"><div class="brand"><img src="icon.png"><span>DriveBond</span></div>
<h1 id="t"></h1><p id="s"></p></div>
<script>
const q=new URLSearchParams(location.search);
document.body.style.setProperty('--dir',q.get('dir'));document.body.style.setProperty('--align',q.get('dir')=='rtl'?'right':'left');
for (const k of ['t','s','chip']) document.getElementById(k).textContent=q.get(k);
if(q.get('dir')=='rtl') document.querySelector('.brand').style.justifyContent='flex-end'; else document.querySelector('.chip').style.top='400px';
</script></body></html>
