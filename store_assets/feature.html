<!doctype html><html lang="he"><head><meta charset="utf-8">
<style>
html,body{margin:0}
body{width:1024px;height:500px;background:#D9573B;font-family:sans-serif;color:#fff;overflow:hidden;position:relative}
.c1{position:absolute;width:560px;height:560px;border-radius:50%;background:#E8674A;left:-160px;top:-200px}
.c2{position:absolute;width:320px;height:320px;border-radius:50%;background:#2F6B57;left:330px;bottom:-230px;opacity:.9}
.card{position:absolute;left:44px;top:70px;width:330px;background:#FFF7EF;border-radius:28px;padding:22px 24px;box-shadow:0 20px 40px rgba(0,0,0,.18);color:#262636;direction:rtl}
.card h3{margin:0 0 14px;font-size:24px}
.row{display:flex;align-items:center;gap:14px;margin:12px 0}
.av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;position:relative;flex:none}
.on{box-shadow:0 0 0 3px #FFF7EF,0 0 0 6px #3E9E72}
.on:after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:#3E9E72;border:3px solid #FFF7EF;bottom:-3px;right:-3px}
.nm{font-weight:700;font-size:21px}
.st{font-size:17px;color:#2F6B57}
.off .st{color:#8A8796}
.txt{position:absolute;right:60px;top:150px;text-align:right}
h1{font-size:84px;margin:0;font-weight:800;direction:ltr;text-align:right;letter-spacing:-1px}
p{font-size:38px;margin:10px 0 0;direction:rtl;font-weight:600}
.sub{font-size:24px;opacity:.9;font-weight:400;margin-top:14px}
</style></head><body><div class="c1"></div><div class="c2"></div>
<div class="card"><h3>מי פנוי עכשיו</h3>
<div class="row"><div class="av on" style="background:#2A9D8F">מ</div><div><div class="nm">מיכל</div><div class="st">🚗 בנסיעה · עוד 25 דק׳</div></div></div>
<div class="row"><div class="av on" style="background:#5A8259">א</div><div><div class="nm">איתי</div><div class="st">☕ בהפסקה · עוד 15 דק׳</div></div></div>
<div class="row off"><div class="av" style="background:#F2A35E">ר</div><div><div class="nm">רוני</div><div class="st">אין זמינות כרגע</div></div></div>
</div>
<div class="txt"><h1>DriveBond</h1><p>זמן מת? שיחה טובה.</p><div class="sub">כששניכם פנויים — מדברים, בלי לתאם.</div></div>
</body></html>
